name: Release

# Tag vX.Y.Z buduje samodzielne pliki dla Linuksa, Windowsa i macOS oraz paczkę dotnet tool,
# po czym publikuje je w GitHub Release razem z sumami SHA-256.
# Ręczne uruchomienie (workflow_dispatch) buduje artefakty z wersją 0.0.0-manual.<numer uruchomienia> i niczego nie publikuje.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Zadania budujące mają tylko odczyt; zapis (contents: write) dostaje wyłącznie zadanie wydania.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; else version="0.0.0-manual.$RUN_NUMBER"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$version' (tag must look like vMAJOR.MINOR.PATCH[-suffix])." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: ubuntu-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: dotnet publish src/CathodeRay.Cli -c Release -r "$RID" --self-contained -p:PublishSingleFile=true -p:Version="$VERSION" -o "dist/cathode-$RID"
      - name: Package
        env:
          RID: ${{ matrix.rid }}
        run: |
          cd dist
          rm -f "cathode-$RID"/*.pdb "cathode-$RID"/*.xml
          if [ "$RID" = win-x64 ]; then
            zip -r "cathode-$RID.zip" "cathode-$RID"
          else
            tar -czf "cathode-$RID.tar.gz" "cathode-$RID"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cathode-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  tool:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: dotnet pack src/CathodeRay.Cli -c Release -p:Version="$VERSION" -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: cathode-tool
          path: dist/*.nupkg

  release:
    needs: [binaries, tool]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Idempotentne: ponowne uruchomienie dla istniejącego wydania podmienia zasoby.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
