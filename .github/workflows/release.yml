name: Release

# Tag vX.Y.Z buduje samodzielne pliki dla Linuksa, Windowsa i macOS oraz paczkę dotnet tool,
# po czym publikuje je w GitHub Release razem z sumami SHA-256.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: ubuntu-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Version
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Publish
        run: >
          dotnet publish src/CathodeRay.Cli -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:Version=${{ steps.v.outputs.version }}
          -o dist/cathode-${{ matrix.rid }}
      - name: Package
        shell: bash
        run: |
          cd dist
          rm -f cathode-${{ matrix.rid }}/*.pdb cathode-${{ matrix.rid }}/*.xml
          if [ "${{ matrix.rid }}" = win-x64 ]; then
            zip -r cathode-${{ matrix.rid }}.zip cathode-${{ matrix.rid }}
          else
            tar -czf cathode-${{ matrix.rid }}.tar.gz cathode-${{ matrix.rid }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cathode-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        shell: bash
        run: dotnet pack src/CathodeRay.Cli -c Release -p:Version="${GITHUB_REF_NAME#v}" -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: cathode-tool
          path: dist/*.nupkg

  release:
    needs: [binaries, tool]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --generate-notes
